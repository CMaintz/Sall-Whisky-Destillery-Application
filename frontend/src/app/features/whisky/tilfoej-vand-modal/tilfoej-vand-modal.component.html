<div class="modal fade" #modalEl tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Tilføj vand — {{ whisky?.navn }}</h5>
        <button type="button" class="btn-close" (click)="close()"></button>
      </div>
      <div class="modal-body">
        @if (error) {
          <div class="alert alert-danger py-2">{{ error }}</div>
        }
        @if (whisky) {
          <div class="mb-3 d-flex justify-content-between small text-muted">
            <span>Nuværende: {{ whisky.antalLiter | number:'1.1-1' }}L vol {{ whisky.alkoholProcent | number:'1.1-1' }}%</span>
          </div>
        }
        <div class="mb-3">
          <label class="form-label">Liter vand</label>
          <div class="input-group">
            <input type="number" class="form-control" [(ngModel)]="liter" min="0.1" step="0.1">
            <span class="input-group-text">L</span>
          </div>
        </div>
        <div class="alert alert-info py-2 small">
          Ny ABV efter tilsætning: <strong>{{ nytAbv | number:'1.1-1' }}%</strong>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="close()">Annuller</button>
        <button class="btn btn-primary" (click)="submit()" [disabled]="saving">
          {{ saving ? 'Gemmer...' : 'Tilføj vand' }}
        </button>
      </div>
    </div>
  </div>
</div>
