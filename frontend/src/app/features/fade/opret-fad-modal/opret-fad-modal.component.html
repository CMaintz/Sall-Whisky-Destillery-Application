<div class="modal fade" #modalEl tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Opret nyt fad</h5>
        <button type="button" class="btn-close" (click)="close()"></button>
      </div>
      <div class="modal-body">
        @if (error) {
          <div class="alert alert-danger py-2">{{ error }}</div>
        }
        <div class="mb-3">
          <label class="form-label">Kapacitet (L)</label>
          <input type="number" class="form-control" [(ngModel)]="literKapacitet" min="1">
        </div>
        <div class="mb-3">
          <label class="form-label">Tidligere indhold</label>
          <input type="text" class="form-control" [(ngModel)]="tidligereIndhold"
                 placeholder="f.eks. Bourbon, Sherry, Port">
        </div>
        <div class="mb-3">
          <label class="form-label">Oprindelsesland</label>
          <input type="text" class="form-control" [(ngModel)]="land" placeholder="f.eks. USA, Skotland">
        </div>
        <div class="mb-3">
          <label class="form-label">Fremstillingsår</label>
          <input type="number" class="form-control" [(ngModel)]="fraAar" min="1900" max="2100">
        </div>
        <div class="mb-3">
          <label class="form-label">Leverandør</label>
          <input type="text" class="form-control" [(ngModel)]="leverandoer">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="close()">Annuller</button>
        <button class="btn btn-primary" (click)="submit()" [disabled]="saving">
          {{ saving ? 'Gemmer...' : 'Opret fad' }}
        </button>
      </div>
    </div>
  </div>
</div>
